# src/briefing/core/retrieval/catalog.yaml — 전역 vetted 출처 CATALOG.
# 추가 = 이 파일 편집 + PR 리뷰(= vetting). 임의 URL 금지(큐레이션).
# 필수: key · name · url · kind(rss|html|auto|sitemap) · lang(en|ko) · category.  선택: fragile(기본 false; *진짜 차단* 출처 — 현재 없음).
#   category = 발행처(publisher/brand) 그룹 → UI 섹션 + 이메일 분야 밴드 그룹핑 키. 비어있지 않음(로더 강제).
#   ⚠️ category 값 = 바뀌지 않는 영문 이름(한국어판·영어판 공통 키 — 값이 곧 영어 표시. 한국어 표시는 두 언어판 때
#      표 하나로 붙인다). 사용자 프로필엔 소스 키만 저장 → 이름을 바꿔도 데이터 이전 없음.
#      소스 3개 이상 발행처 = 자기 섹션(AWS·Anthropic·Google), 나머지 = 성격별 묶음(Independent Voices 등).
#   ⚠️ 섹션 순서 = 이 파일의 첫 등장 순서(build_catalog 이 CATALOG 순서 보존) → 같은 발행처를 인접 배치해 순서를 통제한다.
# kind: rss=피드 직접 / html=리스팅→trafilatura 추출(피드 발견 안 함) / auto=피드 자동발견 후 폴백 / sitemap=사이트맵 urlset→글 페이지 추출.
# ⚠️ 모든 요청은 실행 중 robots.txt(RFC 9309) 검사를 거친다(retrieval/robots.py) — 막힌 경로는 요청하지 않는다.
# ⚠️ sources._load_catalog() 가 로드 시 검증 — 형식 오류면 시작 시 크래시(silent failure 금지).
# last-verified: 2026-06-24

# ── News & Media ─────────────────────────────────────────────
- key: aitimes
  name: AI Times
  url: https://www.aitimes.com/rss/allArticle.xml
  kind: rss
  lang: ko
  category: News & Media
  require_ai: false  # 헤드라인 전용: 제목별 판정 대신 Haiku 가 선별(select) — 제목만으론 신제품명을 AI 로
                     #   못 알아본다(30일 소급: Haiku 4.5 오판 13건). 선별 실패 시 키워드로 비AI 를 뺀 최신순
  # 2026-10-17 적법성 점검: 기사마다 "무단전재 및 재배포, AI학습 및 활용 금지" 고지 → 본문 수집·LLM 요약(카드) 중단.
  #   RSS 의 제목·링크만 메일 맨 위 "헤드라인" 칸에(요약·검증 없음). Haiku 판정·선별엔 **제목만**(headlines.py).
  #   피드 요약문 = 본문 앞 300자 원문 → 싣지 않음. 근거: docs/work_note/Oct-2026/261017-find-new-articles/
  headlines_only: true
  max_items: 15      # 헤드라인 상한 — 메일 맨 위 칸. 실무 핵심 + 국내 AI 가 함께 들어가는 크기(3.5일 시험)
  select: llm        # Haiku 가 제목으로 상한 이하 선별: 실무 핵심 → 국내 AI, 카드와 같은 소식·비AI 제외

- key: the-decoder
  name: The Decoder
  url: https://the-decoder.com/news-sitemap.xml
  kind: sitemap
  lang: en
  category: News & Media
  select: llm        # 일 5~6건 > 기본 캡 5 — 최신순이면 가장 이른 글이 잘린다(10-16: METR 감사 글 컷 실측) → Haiku pick-5
                     #   (풀 12·폴백=최신순). 발행 시각이 정확해 24h 창이 전날과 안 겹침 → 이미 보낸 글을 고를 일 없음
  # 독립 AI 전문 매체(heise medien 소속). AI-scoped(전부 AI) → require_ai 불필요.
  # 2026-10-17 정정: robots `Disallow: */feed/` 가 예전 url(/feed/)을 막고 있었다(urllib.robotparser 가 와일드카드를
  # 무시해 "허용"으로 오판). → robots.txt `Sitemap:` 이 선언한 뉴스 사이트맵(최근 48h·정확한 발행 시각) + 기사 페이지(허용).
  # 홈페이지 링크 = 호스트(https://the-decoder.com). last-verified: 2026-10-17

