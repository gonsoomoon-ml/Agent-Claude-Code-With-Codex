# ── Community ── ★ 맨 끝 고정: 2차 큐레이션은 1차 발행처들 뒤(공식성 내림차순 — UI 섹션·이메일 밴드 공통 순서) ──
- key: pytorch-kr-news
  name: PyTorch Korea 읽을거리
  url: https://discuss.pytorch.kr/c/news/14
  kind: html
  lang: ko
  category: Community
  article_path: /t/  # Discourse 글 = /t/<slug>/<id> — 목록 경로(/c/news/14) 밖이라 접두 경로로 지정
  window_hours: 48   # 글 페이지 날짜가 날짜만 → late-post 보정(W≥U+P). 하루 겹침 중복은 ledger cross-day dedup
  max_items: 3       # 평일 6~9건/일 자동 큐레이션(:30 정각 발행) — 브리핑 편중/비용 상한
  select: llm        # 최신순 잘림 = 고정 시간대 사각지대(실측) → Haiku pick-3(폴백=최신순)
  # Discourse news(읽을거리&정보공유) 카테고리 스코프 — qna/lounge 원천 제외(사이트맵은 전 카테고리라 안 씀).
  # 2026-10-17 정정: robots `Disallow: /c/*.rss` 가 예전 url(/c/news/14.rss)을 막고 있었다 → 허용된 카테고리 목록 페이지.
  # 2차 큐레이션(커뮤니티 요약) — certifier 는 포럼 글 기준 검증. 전문 3~8k자. last-verified: 2026-10-17
