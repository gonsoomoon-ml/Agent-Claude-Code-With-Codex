# 컨테이너용 codex(certifier) 설정 — 구독 변형. CERTIFIER_PROVIDER=subscription 일 때만 쓰인다
# (deploy_runtime 이 런타임 env CODEX_HOME 을 이 파일이 놓이는 ~/.codex-subscription 으로 돌린다).
# ★ model_provider 를 적지 않는다 = codex 기본(OpenAI · ChatGPT 로그인).
# ★ 비밀값 0: 로그인 파일 auth.json 은 이미지에 없다 — run 시작 때 runtime/harness_auth 가 SSM 에서 꺼내 이 폴더에 쓴다.
# ★ 모델 이름은 직접 호출용(gpt-6-luna) — Bedrock 변형의 openai.gpt-6-luna 가 아니다. effort 는 Bedrock 변형과 같다.
model = "gpt-6-luna"
model_reasoning_effort = "medium"
# 로그인을 OS keyring 이 아니라 파일(auth.json)로 읽고 쓴다 — 컨테이너에는 keyring 이 없고, harness_auth 가 이 파일을 복원·되쓴다.
cli_auth_credentials_store = "file"
